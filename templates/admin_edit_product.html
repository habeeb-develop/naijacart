<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
Edit Product | NaijaCart
</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/admin.css') }}">

</head>


<body class="admin-body">


<aside class="admin-sidebar">

<div class="admin-brand">

<div class="brand-icon">N</div>

<div>
<strong>NaijaCart</strong>
<span>Admin Panel</span>
</div>

</div>


<nav class="admin-navigation">

<a href="{{ url_for('admin_dashboard') }}"
   class="admin-nav-link">

<span>📊</span>
Dashboard

</a>

<a href="{{ url_for('admin_orders') }}"
   class="admin-nav-link">

<span>🛒</span>
Orders

</a>

<a href="{{ url_for('admin_products') }}"
   class="admin-nav-link active">

<span>📦</span>
Products

</a>

<a href="{{ url_for('admin_customers') }}"
   class="admin-nav-link">

<span>👥</span>
Customers

</a>

<a href="{{ url_for('admin_sellers') }}"
   class="admin-nav-link">

<span>🏪</span>
Sellers

</a>

</nav>


<div class="sidebar-bottom">

<a href="{{ url_for('home') }}"
   class="admin-nav-link">

<span>🌐</span>
View Store

</a>

<a href="{{ url_for('admin_logout') }}"
   class="admin-nav-link logout-link">

<span>🚪</span>
Logout

</a>

</div>

</aside>


<main class="admin-main">


<header class="admin-header">

<div>

<a href="{{ url_for('admin_products') }}"
   class="back-link">

← Back to Products

</a>

<h1>
Edit Product
</h1>

<p>
Update product information.
</p>

</div>

</header>


<section class="dashboard-panel edit-product-panel">


<form method="POST"
      action="{{ url_for('edit_product', product_id=product['id']) }}"
      class="product-form">


<div class="form-grid">


<div class="form-group">

<label>
Product Name
</label>

<input
type="text"
name="name"
value="{{ product['name'] }}"
required>

</div>


<div class="form-group">

<label>
Category
</label>

<select name="category" required>

<option value="fashion"
{% if product['category'] == 'fashion' %}selected{% endif %}>
Fashion
</option>

<option value="groceries"
{% if product['category'] == 'groceries' %}selected{% endif %}>
Groceries
</option>

<option value="electronics"
{% if product['category'] == 'electronics' %}selected{% endif %}>
Electronics
</option>

<option value="beauty"
{% if product['category'] == 'beauty' %}selected{% endif %}>
Beauty
</option>

<option value="home"
{% if product['category'] == 'home' %}selected{% endif %}>
Home
</option>

</select>

</div>


<div class="form-group">

<label>
Price (₦)
</label>

<input
type="number"
name="price"
step="0.01"
min="0"
value="{{ product['price'] }}"
required>

</div>


<div class="form-group">

<label>
Stock
</label>

<input
type="number"
name="stock"
min="0"
value="{{ product['stock'] }}"
required>

</div>


<div class="form-group full">

<label>
Image URL
</label>

<input
type="url"
name="image"
value="{{ product['image'] or '' }}">

</div>


<div class="form-group full">

<label>
Description
</label>

<textarea
name="description"
rows="6">{{ product['description'] or '' }}</textarea>

</div>


</div>


<div class="form-actions">

<a href="{{ url_for('admin_products') }}"
   class="secondary-button">

Cancel

</a>


<button type="submit"
        class="primary-button">

Save Changes

</button>

</div>


</form>

</section>


</main>

</body>
</html>
