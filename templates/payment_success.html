<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | NaijaCart</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #222;
        }
        .box {
            max-width: 650px;
            margin: 80px auto;
            padding: 35px;
            background: white;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }
        .icon { font-size: 60px; }
        h1 { color: #006b57; }
        .details {
            margin: 25px 0;
            padding: 18px;
            background: #f7faf9;
            border-radius: 10px;
            text-align: left;
        }
        .row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 8px 0;
        }
        .button {
            display: inline-block;
            padding: 12px 22px;
            background: #006b57;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">✓</div>
        <h1>Payment Successful!</h1>
        <p>Thank you for shopping with NaijaCart.</p>

        <div class="details">
            <div class="row">
                <strong>Order</strong>
                <span>#{{ order.id }}</span>
            </div>
            <div class="row">
                <strong>Total</strong>
                <span>₦{{ "{:,.2f}".format(order.total) }}</span>
            </div>
            <div class="row">
                <strong>Status</strong>
                <span>{{ order.status }}</span>
            </div>
            <div class="row">
                <strong>Payment</strong>
                <span>Paid</span>
            </div>
        </div>

        <a class="button" href="{{ url_for('home') }}">
            Continue Shopping
        </a>
    </div>
</body>
</html>
